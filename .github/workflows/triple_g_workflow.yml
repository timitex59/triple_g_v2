name: Triple G Indicators Scan

on:
  schedule:
    - cron: "15 4-22 * * 1-5" # Du lundi au vendredi, de 4h15 à 22h15 UTC
    # TEST JOUR : Toutes les heures à la minute 10
    #- cron: "10 * * * *"
  workflow_dispatch:
    # Permet le lancement manuel

permissions:
  contents: write # Important pour pouvoir pusher les changements de runner_history.json

concurrency:
  group: triple-g-state-updates
  cancel-in-progress: false

jobs:
  run-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip" # Cache les dépendances pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio yfinance requests pandas numpy

      - name: Verify dependency consistency
        run: |
          python -m pip check

      - name: Validate critical imports
        run: |
          python -c "import websocket; print('websocket import OK')"

      - name: Run Pytest RSB Test Suite (RSB-C1 Quality Control)
        run: |
          python -m pytest tests/test_relative_strength.py tests/test_execution_policies.py -v

      - name: Run Triple G Indicators Scan & RSB Production Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          REVERSAL_TZ: Europe/Paris
          ENABLE_TELEGRAM_BREAK_LINE: "false"
          ENABLE_TELEGRAM_ICHIMOKU: "false"
          ENABLE_TELEGRAM_CONSOLIDATION: "false"
          ENABLE_TELEGRAM_BREAK_LINE_RENKO: "false"
          ENABLE_TELEGRAM_HEIKEN: "false"
          ENABLE_TELEGRAM_PX_RENKO_V4: "false"
          ENABLE_TELEGRAM_PX_RENKO_INDEX: "false"
          ENABLE_TELEGRAM_PX_RENKO_INDEX_V2: "false"
          ENABLE_TELEGRAM_ETF_V1: "false"
          ENABLE_TELEGRAM_ETF_V3: "false"
          ENABLE_TELEGRAM_NASDAQ_PIPELINE: "true"
          ENABLE_TELEGRAM_MIDDLE_PIPELINE: "true"
          ENABLE_TELEGRAM_COMBO: "true"
          ENABLE_TELEGRAM_BINANCE_CMC_TOP100_PIPELINE: "true"
          ENABLE_TELEGRAM_SAR_MTF_FOREX: "false"
          ENABLE_TELEGRAM_RENKO_FOREX_V1: "false"
          ENABLE_TELEGRAM_RENKO_FOREX_V2: "false"
          ENABLE_TELEGRAM_RENKO_SCORE_29: "true"
          ENABLE_TELEGRAM_FULL_ALIGNMENT: "true"
          ENABLE_TELEGRAM_PAIRE_CHECK: "true"
          ENABLE_TELEGRAM_FIBO_50: "true"
          ENABLE_TELEGRAM_DCA: "true"
          ENABLE_TELEGRAM_RENKO_FOREX_V4: "false"
          ENABLE_TELEGRAM_TRACKER: "false"
          ENABLE_TELEGRAM_FIOS: "false"
          ENABLE_TELEGRAM_RSB_C1: "false"
          ENABLE_TELEGRAM_FOREX_AI_BRAIN: "false"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: "practice"
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          HOUR_MIN_PARIS=$(TZ="$REVERSAL_TZ" date +%H%M)
          export TG_BOT_TOKEN="$TELEGRAM_BOT_TOKEN"
          export TG_CHAT_ID="$TELEGRAM_CHAT_ID"

          run_with_telegram() {
            ENABLE_FLAG="$1"
            shift
            if [ "$ENABLE_FLAG" = "true" ]; then
              TELEGRAM_BOT_TOKEN="$TG_BOT_TOKEN" TELEGRAM_CHAT_ID="$TG_CHAT_ID" python "$@"
            else
              echo "Skip (Telegram disabled): python $@"
            fi
          }

          # 07H Relative Strength Breakout Production Engine (RSB-C1 Cap 15)
          run_with_telegram "$ENABLE_TELEGRAM_RSB_C1" rsb_runner.py || echo "07H RSB Engine run failed (non-fatal)"

          run_with_telegram "$ENABLE_TELEGRAM_PX_RENKO_INDEX" px_renko_screener_index.py
          run_with_telegram "$ENABLE_TELEGRAM_PX_RENKO_INDEX_V2" px_renko_screener_index_V2.py
          if [ "$HOUR_MIN_PARIS" -ge 1800 ] && [ "$HOUR_MIN_PARIS" -lt 2100 ]; then
            run_with_telegram "$ENABLE_TELEGRAM_ETF_V1" renko_alignment_etf_V1.py
          else
            echo "Skip renko_alignment_etf_V1.py outside 18:00-21:00 Europe/Paris"
          fi

          if [ "$HOUR_MIN_PARIS" -ge 1800 ] && [ "$HOUR_MIN_PARIS" -lt 2100 ]; then
            run_with_telegram "$ENABLE_TELEGRAM_NASDAQ_PIPELINE" nasdaq_sector_pipeline.py --no-telegram
          else
            echo "Skip nasdaq_sector_pipeline.py outside 18:00-21:00 Europe/Paris"
          fi

          if [ "$HOUR_MIN_PARIS" -ge 1900 ] && [ "$HOUR_MIN_PARIS" -lt 2100 ]; then
            run_with_telegram "$ENABLE_TELEGRAM_MIDDLE_PIPELINE" middle_pipeline.py --no-telegram
          else
            echo "Skip middle_pipeline.py outside 19:00-21:00 Europe/Paris"
          fi

          if [ "$HOUR_MIN_PARIS" -ge 1900 ] && [ "$HOUR_MIN_PARIS" -lt 2100 ]; then
            run_with_telegram "$ENABLE_TELEGRAM_COMBO" combo_pipeline.py
          else
            echo "Skip combo_pipeline.py outside 19:00-21:00 Europe/Paris"
          fi

          if [ "$HOUR_MIN_PARIS" -ge 1900 ] && [ "$HOUR_MIN_PARIS" -lt 2100 ]; then
            run_with_telegram "$ENABLE_TELEGRAM_BINANCE_CMC_TOP100_PIPELINE" binance_cmc_top100_pipeline.py --exchange auto
          else
            echo "Skip binance_cmc_top100_pipeline.py outside 19:00-21:00 Europe/Paris"
          fi

          if [ "$HOUR_MIN_PARIS" -ge 1800 ] && [ "$HOUR_MIN_PARIS" -lt 2100 ]; then
            run_with_telegram "$ENABLE_TELEGRAM_ETF_V3" renko_etf_strategy_V3.py
          else
            echo "Skip renko_etf_strategy_V3.py outside 18:00-21:00 Europe/Paris"
          fi

          run_with_telegram "$ENABLE_TELEGRAM_SAR_MTF_FOREX" sarenki_V1_forex.py
          run_with_telegram "$ENABLE_TELEGRAM_RENKO_FOREX_V1" renko_forex_V1.py
          run_with_telegram "$ENABLE_TELEGRAM_RENKO_FOREX_V2" renko_forex_V2.py
          run_with_telegram "$ENABLE_TELEGRAM_RENKO_SCORE_29" renko_score_29pairs_v16.py
          run_with_telegram "$ENABLE_TELEGRAM_FULL_ALIGNMENT" renko_full_alignment_29pairs.py --telegram
          run_with_telegram "$ENABLE_TELEGRAM_PAIRE_CHECK" paire_check.py --telegram
          run_with_telegram "$ENABLE_TELEGRAM_FIBO_50" renko_fibo_50_strategy.py --telegram

          if [ "$HOUR_MIN_PARIS" -ge 2000 ]; then
            run_with_telegram "$ENABLE_TELEGRAM_DCA" dca_euronext.py
          else
            echo "Skip dca_euronext.py before 20:00 Europe/Paris"
          fi
          run_with_telegram "$ENABLE_TELEGRAM_RENKO_FOREX_V4" renko_forex_V4.py --force-telegram
          run_with_telegram "$ENABLE_TELEGRAM_FIOS" -m fios.run || echo "FIOS run failed (non-fatal)"

          run_with_telegram "$ENABLE_TELEGRAM_FOREX_AI_BRAIN" forex_ai_brain.py || echo "Forex AI Brain run failed (non-fatal)"

          run_with_telegram "$ENABLE_TELEGRAM_BREAK_LINE" break_line.py
          run_with_telegram "$ENABLE_TELEGRAM_ICHIMOKU" ichimoku_v4.py
          run_with_telegram "$ENABLE_TELEGRAM_CONSOLIDATION" triple_g_consolidation.py
          run_with_telegram "$ENABLE_TELEGRAM_BREAK_LINE_RENKO" break_line_renko_strategy.py --telegram
          run_with_telegram "$ENABLE_TELEGRAM_HEIKEN" heiken_ashi_aligned_v2.py
          run_with_telegram "$ENABLE_TELEGRAM_PX_RENKO_V4" px_renko_screener_v4.py
          run_with_telegram "$ENABLE_TELEGRAM_TRACKER" strategy_tracker.py

      - name: Commit and Push History
        if: always()
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          BRANCH="${GITHUB_REF_NAME:-main}"
          STATE_FILES="runner_history.json opportunity_stats.json trend_follower.json rubbeon_state.json rubbeon_MTF_IMP_state.json annual_v2_data.json annual_v2_state.json chg_cc_indices.json annual_ndx100_portfolio_state.json annual_ndx100_scan_state.json btc_dca_state.json signal_v7_exit_state.json break_line_state.json break_line_scan.json break_line_renko_state.json break_line_renko_scan.json renko_lists_tracker_state.json ichimoku_scan.json triple_g_consolidation.json heiken_ashi_scan.json strategy_tracker_state.json px_renko_index_scan.json px_renko_index_tracker_state.json px_renko_daily_follow.json px_renko_daily_follow_v2.json etf_v1_metrics_history.json renko_etf_strategy_v3_state.json renko_etf_strategy_v3_metrics.json renko_nasdaq_state.json renko_nasdaq_tracker.json renko_nasdaq_pnl_history.json renko_nasdaq_portfolio.json nasdaq_sector_pipeline_report.json nasdaq_sector_pipeline_report.txt nasdaq_top_ucits_etf.json nasdaq_pipeline_send.json combo_pipeline_send.json combo_top_assets.json middle_pipeline_report.json middle_pipeline_report.txt middle_pipeline_tracker.json sarenki_V1_forex_log.json renko_forex_v1_state.json renko_forex_v1_tracker.json renko_forex_v1_pnl_history.json renko_forex_v1_portfolio.json renko_forex_v1_spreads.json renko_forex_v2_state.json renko_forex_v2_tracker.json renko_forex_v2_pnl_history.json renko_forex_v2_portfolio.json renko_forex_v2_spreads.json renko_forex_v4_state.json renko_forex_v4_tracker.json renko_forex_v4_pnl_history.json renko_forex_v4_portfolio.json renko_forex_v4_spreads.json renko_score_29pairs_vivier_state.json renko_vivier_events.jsonl renko_vivier_performance.json renko_vivier_pips.json renko_vivier_price_trend_state.json renko_strength_history.json renko_intraday_live.json renko_full_alignment_mid_sar_state.json renko_full_alignment_price_trend_state.json renko_full_alignment_pairs_out_state.json renko_full_alignment_performance_state.json paire_check_price_trend_state.json dca_euronext_state.json renko_fibo_50_state.json renko_fibo_50_pips.json renko_fibo_50_price_trend_state.json renko_fibo_50_snapshot.json full_alignment_index.json fios_podium_state.json fios_index_chg_state.json forex_ai_knowledge_base.json rsb_state.json rsb_audit_trail.jsonl"

          for f in $STATE_FILES; do
            [ -f "$f" ] && cp "$f" "/tmp/ci_state_$(basename $f)" 2>/dev/null || true
          done

          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            echo "WARNING: rebase in progress, aborting..."
            git rebase --abort 2>/dev/null || true
          fi

          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

          for f in $STATE_FILES; do
            [ -f "/tmp/ci_state_$(basename $f)" ] && cp "/tmp/ci_state_$(basename $f)" "$f" 2>/dev/null || true
          done

          PUSH_OK=0
          for attempt in 1 2 3; do
            echo "---- git status before add (attempt $attempt) ----"
            git status --short
            for f in $STATE_FILES; do
              if [ -f "$f" ]; then
                git add --force "$f" 2>/dev/null || true
              fi
            done
            echo "---- staged files after add (attempt $attempt) ----"
            git diff --staged --name-only
            if git diff --staged --quiet; then
              echo "No staged changes to commit"
              PUSH_OK=1
              break
            fi

            git commit -m "Update runner and stats history [skip ci]"
            if git push origin "HEAD:$BRANCH"; then
              echo "Push OK on attempt $attempt"
              PUSH_OK=1
              break
            fi

            echo "WARNING: push failed on attempt $attempt, refreshing branch and retrying..."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            for f in $STATE_FILES; do
              [ -f "/tmp/ci_state_$(basename $f)" ] && cp "/tmp/ci_state_$(basename $f)" "$f" 2>/dev/null || true
            done
            sleep $((attempt * 5))
          done

          if [ "$PUSH_OK" -ne 1 ]; then
            echo "WARNING: all push attempts failed"
          fi
